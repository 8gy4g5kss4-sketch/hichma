<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HICHMA — حشمة</title>

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+Arabic:wght@300;400&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/hero.css">

</head>

<body>

  <!-- CURSOR -->
  <div class="cursor" id="cursor"></div>
  <div class="cursor-follower" id="cursor-follower"></div>

  <!-- HERO -->
  <section class="hero">

    <div class="hero-bg">
      <video autoplay muted loop playsinline>
        <source src="assets/video/hero.mp4" type="video/mp4">
      </video>
    </div>

    <div class="hero-overlay"></div>

    <div class="hero-content">
      <p class="hero-label reveal">حشمة</p>
      <h1 class="hero-title reveal reveal-delay-1">HICHMA</h1>
      <p class="hero-sub reveal reveal-delay-2">أناقة أصيلة — تُعبّر عنكِ</p>
    </div>

    <!-- Scroll indicator -->
    <div class="hero-scroll reveal reveal-delay-3">
      <span class="hero-scroll__line"></span>
    </div>

  </section>

  <!-- JS -->
  <script src="js/cursor.js" defer></script>
  <script src="js/scroll.js" defer></script>
  <script src="js/hero.js" defer></script>
  <script src="js/app.js" defer></script>

</body>
</html>
