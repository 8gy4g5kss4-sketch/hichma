<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HICHMA — حشمة</title>

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+Arabic:wght@300;400&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/hero.css">

</head>

<body>

  <!-- CURSOR -->
  <div class="cursor" id="cursor"></div>
  <div class="cursor-follower" id="cursor-follower"></div>

  
<!-- HERO -->
<section class="hero">

  <div class="hero-bg">
    <video autoplay muted loop playsinline>
      <source src="assets/video/hero.mp4" type="video/mp4">
    </video>
  </div>

  <div class="hero-overlay"></div>

  <!-- Corner marks -->
  <div class="hero-corner hero-corner--tl"></div>
  <div class="hero-corner hero-corner--tr"></div>
  <div class="hero-corner hero-corner--bl"></div>
  <div class="hero-corner hero-corner--br"></div>

  <!-- Content -->
  <div class="hero-content">

    <!-- الشعار الكاليغرافي — نص فقط -->
    <h1 class="hero-logo-text reveal">حِشمة</h1>

    <!-- English -->
    <p class="hero-name-en reveal reveal-delay-1">HICHMA</p>

    <!-- Divider -->
    <div class="hero-divider reveal reveal-delay-2"></div>

    <!-- Tagline — الآية -->
    <p class="hero-tagline reveal reveal-delay-3">
      يُدنينَ عليهنَّ من جلابيبهنَّ
    </p>

  </div>

  <!-- Scroll -->
  <div class="hero-scroll">
    <span class="hero-scroll__text">scroll</span>
    <span class="hero-scroll__line"></span>
  </div>

</section>
  <!-- JS -->
  <script src="js/cursor.js" defer></script>
  <script src="js/scroll.js" defer></script>
  <script src="js/hero.js" defer></script>
  <script src="js/app.js" defer></script>

</body>
</html>
